name: fitai
description: "FitAI - AI-powered fitness tracking app"
publish_to: 'none'
version: 1.3.1+106

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  go_router: ^14.8.1
  mobile_scanner: ^6.0.2
  fl_chart: ^0.70.2
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.4
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^3.0.1
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  health: ^13.3.1
  share_plus: ^10.1.4
  gal: ^2.3.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  purchases_flutter: ^10.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/.env
    - assets/icons/
    - assets/images/
    - assets/images/anatomy/
    - assets/images/anatomy/masks/
    - assets/images/anatomy/light/
    - assets/images/anatomy/light/masks/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
        - asset: assets/fonts/LeagueSpartan-Medium.ttf
          weight: 500
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700
    # Field Manual faces (variable fonts; weights selected via
    # FontVariation in FieldManual text styles, not the weight: axis here).
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
